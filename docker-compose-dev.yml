# Optional containerized development. Native Bun development needs no containers.
services:
  dashhack:
    image: oven/bun:1.3.2
    working_dir: /app
    command: sh -c 'bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0'
    environment:
      NUXT_SQLITE_PATH: /data/dashhack.sqlite
    ports:
      - "127.0.0.1:5002:5002"
    volumes:
      - .:/app
      - dashhack-deps:/app/node_modules
      - dashhack-dev-data:/data

volumes:
  dashhack-deps:
  dashhack-dev-data:
