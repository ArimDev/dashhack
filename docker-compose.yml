services:
  dashhack:
    build: .
    restart: unless-stopped
    environment:
      PORT: 1020
      HOST: 0.0.0.0
      NUXT_SQLITE_PATH: /data/dashhack.sqlite
      NUXT_PUBLIC_DISCORD_INVITE: ${NUXT_PUBLIC_DISCORD_INVITE:-}
    ports:
      - "127.0.0.1:${webPort:-1020}:1020"
    volumes:
      - dashhack-data:/data

volumes:
  dashhack-data:
