services:
  dashhack:
    image: dashhack
    build:
      context: .
      args:
        webPort: ${webPort}
    container_name: dashhack
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${webPort}:${webPort}"
    networks:
      - NuxtEr

networks:
  NuxtEr:
    external: true
